name: Check travel planner
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Test secure server key configuration
        run: python3 -m unittest discover -s backend/tencent -p 'test_*.py'
      - run: npm run build
      - run: npm --prefix backend run build
